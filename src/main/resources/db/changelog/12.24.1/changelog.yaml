            sql: |
              WITH cte AS (
                SELECT
                  id
                FROM conta
                WHERE dia_fechamento IS NULL
              )
              UPDATE conta
              SET dia_fechamento = 0
              FROM cte
              WHERE conta.id = cte.id;
            dbms: postgresql
