#### DATASOURCE ####
spring.datasource.url=jdbc:h2:mem:tests;INIT=CREATE SCHEMA IF NOT EXISTS liquibase\\;CREATE SCHEMA IF NOT EXISTS hibernate
spring.datasource.generate-unique-name=false
spring.datasource.name=sampletestdb

# Configuração do Hibernate
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.default_schema=hibernate

# LIQUIBASE
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
spring.liquibase.default-schema=liquibase
spring.liquibase.liquibase-schema=liquibase


